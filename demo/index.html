<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DM Slide demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; background: #000; color: #f5f5f5;
        font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #header {
        display: flex; align-items: center; gap: 10px; padding: 12px 16px;
        border-bottom: 1px solid #262626;
      }
      .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6a8dff, #b46aff); }
      .title { font-weight: 600; flex: 1; }
      .title small { display: block; font-weight: 400; color: #a8a8a8; }
      #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
      .row { display: flex; align-items: flex-end; gap: 8px; margin-top: 10px; position: relative; }
      .who { font-size: 12px; color: #a8a8a8; width: 40px; }
      .share { width: 130px; height: 200px; border-radius: 14px; object-fit: cover; cursor: pointer; }
      .mine { position: absolute; left: 160px; bottom: -6px; font-size: 16px; }
      .note, .reply { margin: 0; padding: 8px 12px; border-radius: 18px; max-width: 60%; }
      .note { background: #262626; margin-left: 48px; align-self: flex-start; }
      .reply { background: #3797f0; align-self: flex-end; }
      #layer {
        position: fixed; inset: 40px; z-index: 10; display: grid; place-items: center;
        background: #1c1c1c; border-radius: 12px;
      }
      #layer[hidden] { display: none; }
      #layer-close { position: absolute; top: 12px; right: 12px; font-size: 18px; background: none; border: 0; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <header id="header">
      <span class="avatar"></span>
      <span class="title">Alex, Sam <small>Demo chat · invented people, generated media</small></span>
    </header>
    <main id="chat"></main>
    <div id="layer" role="dialog" hidden>
      <button id="layer-close" title="Close">✕</button>
      <p></p>
    </div>
    <script type="module" src="demo.js"></script>
  </body>
</html>
